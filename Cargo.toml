[package]
name = "docgen-cli"
version = "0.1.0"
edition = "2021"
authors = ["Kaizoku <https://github.com/0xkaizoku>"]
description = "Blazing-fast zero-dependency universal document engine (PDF, DOCX, XLSX, HTML), CLI tool, and MCP server"
readme = "README.md"
license = "SEE LICENSE IN LICENSE"
repository = "https://github.com/0xkaizoku/docgen-cli"
homepage = "https://github.com/0xkaizoku/docgen-cli"
keywords = ["document-generator", "pdf", "docx", "xlsx", "mcp-server"]
categories = ["command-line-utilities", "text-processing", "development-tools"]

[lib]
name = "docgen_cli"
path = "src/lib.rs"

[[bin]]
name = "docgen"
path = "src/main.rs"

[[bin]]
name = "docgen-cli"
path = "src/bin/docgen_cli.rs"

[[bin]]
name = "doc"
path = "src/bin/doc.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = "0.9"
docx-rs = "0.4"
rust_xlsxwriter = "0.64"
handlebars = "4.5"
syntect = "5.1"
anyhow = "1.0"
colored = "2.1"
dirs = "5.0"
open = "5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
